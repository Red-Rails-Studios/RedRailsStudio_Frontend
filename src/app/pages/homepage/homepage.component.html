<img
    src="assets/tmp_b4313719-be33-4e90-b882-c2a8b4925a9a.jpeg"
    class="main-menu-img"
/>

<div class="menu-overlay">
    <div *ngIf="showMain">
        <button
            class="main-menu-button"
            (click)="showCreate = true; showJoin = false; showMain = false"
        >
            Create Session
        </button>
        <button
            class="main-menu-button"
            (click)="showJoin = true; showCreate = false; showMain = false"
        >
            Join Session
        </button>
    </div>

    <div *ngIf="showCreate">
        <input
            type="text"
            class="menu-input"
            [(ngModel)]="playerName"
            placeholder="Nickname"
        />
        <input
            type="text"
            class="menu-input"
            [(ngModel)]="sessionName"
            placeholder="Session Name"
            maxlength="20"
        />
        <button
            class="menu-button"
            [disabled]="playerName.length < 3 || sessionName.length < 3"
            (click)="onCreateSession()"
        >
            Create Game
        </button>
        <button
            class="menu-button"
            (click)="showMain = true; showCreate = false; showJoin = false"
            (click)="clearFields()"
        >
            Back
        </button>
    </div>

    <div *ngIf="showJoin">
        <input
            type="text"
            class="menu-input"
            [(ngModel)]="inputNameJoin"
            placeholder="Nickname"
        />
        <input
            type="text"
            class="menu-input"
            [(ngModel)]="joinSession"
            placeholder="Session Name"
            maxlength="20"
        />
        <button
            class="menu-button"
            [disabled]="playerName.length < 3 || sessionName.length < 3"
            (click)="null"
        >
            Join Game
        </button>
        <button
            class="menu-button"
            (click)="showMain = true; showCreate = false; showJoin = false"
            (click)="clearFieldsJoin()"
        >
            Back
        </button>
    </div>
</div>
