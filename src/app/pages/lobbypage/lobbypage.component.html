<img
    src="assets/tmp_b4313719-be33-4e90-b882-c2a8b4925a9a.jpeg"
    class="main-menu-img"
/>

<div class="menu-overlay lobby-box">
    <h2 class="lobby-title">Lobby {{ store.sessionName() }}</h2>

    <div *ngIf="lobbyPlayers.length">
        <h3 class="lobby-text">Players in Lobby ({{ lobbyPlayers.length }}/4):</h3>
        <ul>
            <li class="lobby-text" *ngFor="let player of lobbyPlayers">
                <span class="player-swatch" [style.background]="colorForUid(player)"></span>
                {{ player.name }}
            </li>
        </ul>
    </div>
    <div class="lobby-buttons-row">
        <button class="menu-button" (click)="onStartSession()"> Start Game </button>
        <button class="menu-button" (click)="onLeaveLobby()"> Leave Lobby </button>
    </div>  
</div>

<div *ngFor="let p of lobbyPlayers">
  <span class="player-color"
        [style.background]="normalizeColor(p.color) || '#000'"
        [title]="p.displayName || p.name"></span>
  <span class="player-name">{{ p.displayName || p.name }}</span>
</div>
