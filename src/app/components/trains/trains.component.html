<div class="train-set">
    <button (click)="onBuyTrain()" class="buy-button">
        Buy Train</button>
    <div class="train-list">
        <div *ngFor="let trainDtos of trains; let i=index" class="train-block">
            <img class="train-pic" src="assets/retro-pixel-art-train-tracks-vibrant-detailed-digital-illustration_1292377-15709.avif" alt="button Image">
            train Nr. {{i+1}}
            level:{{trainDtos.level}}
            
           {{upgrades[i].requiredDbCoins}}
                       <button (click)="onUpgradeTrain(i)" class="upgrade-button">
                <div *ngIf="upgrades[i]">
                    <!-- Required DB Coins:--> {{upgrades[i].requiredDbCoins}} <!-- //TODO: it doesnt show-->
                </div>
                <div *ngIf="!upgrades[i]">
                    No requirements available.
                </div>
            </button>
        </div>
    </div>
</div>
