<div class="train-set">
    <button (click)="onBuyTrain()" class="buy-button">
        <img class="buy-image homepage" src="retro-pixel-art-train-tracks-vibrant-detailed-digital-illustration_1292377-15709.avif" alt="button Image">
        Buy Train</button>

    <div class="train-list">
        <div *ngFor="let trainDtos of trains; let i=index" class="train-block">
            train Nr. {{i+1}}
            level:{{trainDtos.level}}
           <!-- {{upgrades[i].requiredDbCoins}}-->
            <button (click)="onUpgradeTrain(i)" class="upgrade-button"><!--{{upgrade cost}}-->/db</button>
        </div>
    </div>
</div>
